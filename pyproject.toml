[project]
name = "wx1-lorenzo"
version = "0.1.1"
description = "Lossless 2-D Lorenzo predictor as a Zarr v3 ArrayArrayCodec for GRIB-quantised weather grids"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jordy van Gils", email = "developer.tempestwx1@gmail.com" }]
keywords = [
    "zarr",
    "zarr-v3",
    "codec",
    "meteorology",
    "grib",
    "compression",
    "lorenzo",
    "weather",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["zarr>=3.1", "numpy"]

[project.optional-dependencies]
grib = ["eccodes", "numcodecs"]

[project.urls]
Homepage = "https://github.com/developer-tempest-wx1/wx1-lorenzo"
Repository = "https://github.com/developer-tempest-wx1/wx1-lorenzo"
Issues = "https://github.com/developer-tempest-wx1/wx1-lorenzo/issues"

[project.entry-points."zarr.codecs"]
"wx1.lorenzo2d" = "wx1_lorenzo:Lorenzo2DCodec"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
